apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: gold-to-postgres
  namespace: spark
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster

  image: apache/spark:3.5.1
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/app/app.py
  sparkVersion: "3.5.1"

  restartPolicy:
    type: OnFailure
    onFailureRetries: 3
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 5
    onSubmissionFailureRetryInterval: 20

  # If you use MinIO HTTP internally
  sparkConf:
    spark.jars.ivy: "/tmp/ivy"

    # S3A to MinIO (HTTP)
    spark.hadoop.fs.s3a.endpoint: "http://net-tel-minio.primary-object-store.svc.cluster.local:9000"
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.hadoop.fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
    spark.hadoop.fs.s3a.aws.credentials.provider: "com.amazonaws.auth.EnvironmentVariableCredentialsProvider"
    spark.hadoop.fs.s3a.region: "us-east-1"

    spark.sql.streaming.forceDeleteTempCheckpointLocation: "true"
    spark.dynamicAllocation.enabled: "false"
    spark.executor.instances: "1"

  deps:
    packages:
      - org.apache.hadoop:hadoop-aws:3.3.4
      - com.amazonaws:aws-java-sdk-bundle:1.12.262

  driver:
    serviceAccount: spark
    cores: 1
    memory: "1g"

    env:
      - name: PYTHONUNBUFFERED
        value: "1"
      - name: PYTHONPATH
        value: "/opt/spark/python-deps"

      # Bronze path
      - name: BRONZE_PATH
        value: "s3a://datalake/bronze/router_metrics"
      - name: GOLD_CHECKPOINT
        value: "s3a://datalake/checkpoints/gold_to_postgres_v1"

      # Postgres connection
      - name: PG_HOST
        value: "postgres.postgres.svc.cluster.local"
      - name: PG_PORT
        value: "5432"
      - name: PG_DB
        value: "telemetry"
      - name: PG_USER
        value: "telemetry"
      - name: PG_PASS
        value: "telemetrypass"

      # MinIO creds (same secret you use elsewhere)
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: minio-creds
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-creds
            key: AWS_SECRET_ACCESS_KEY

    initContainers:
      - name: pip-install
        image: python:3.11-slim
        command: ["sh","-lc"]
        args:
          - |
            set -e
            pip install --no-cache-dir -t /opt/spark/python-deps psycopg2-binary==2.9.9
            ls -lah /opt/spark/python-deps | head
        volumeMounts:
          - name: python-deps
            mountPath: /opt/spark/python-deps

    volumeMounts:
      - name: app-volume
        mountPath: /opt/spark/app
      - name: python-deps
        mountPath: /opt/spark/python-deps

  executor:
    instances: 1
    cores: 1
    memory: "1g"
    env:
      - name: PYTHONUNBUFFERED
        value: "1"
      # Only needed if you ever move DB writing to executors; safe to keep.
      - name: PYTHONPATH
        value: "/opt/spark/python-deps"
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: minio-creds
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-creds
            key: AWS_SECRET_ACCESS_KEY
    volumeMounts:
      - name: app-volume
        mountPath: /opt/spark/app
      - name: python-deps
        mountPath: /opt/spark/python-deps

  volumes:
    - name: app-volume
      configMap:
        name: gold-to-postgres-app
        items:
          - key: app.py
            path: app.py
    - name: python-deps
      emptyDir: {}
