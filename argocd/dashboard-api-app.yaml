apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard-api
  namespace: argocd
spec:
  project: data-pipeline
  source:
    repoURL: https://github.com/network-telemetry-pipeline/data-pipeline.git
    targetRevision: main
    path: dashboard-api
  destination:
    server: https://kubernetes.default.svc
    namespace: api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
